spring:
  application:
    name: product-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      # The outbox relies on returns to detect unroutable events; mandatory must stay true.
      mandatory: true

server:
  port: 8081

jwt:
  jwks-uri: ${JWT_JWKS_URI:http://localhost:8083/.well-known/jwks.json}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://product-db:5432/product_db
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:product_user}
    password: ${DB_PASSWORD:product_password}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
